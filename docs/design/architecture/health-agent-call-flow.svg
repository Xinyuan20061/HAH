<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">HealthMate 制定计划的软件调用时序</title>
<desc id="desc">用户在小程序或 Android 端提出制定计划请求；API 校验身份和授权；Harness 路由 Planner，并调用工具与模型；Decision 形成待确认草案；用户确认后才由 Action 接口入库。</desc>
<defs><marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth"><path d="M1 1 L9 5.5 L1 10" fill="none" stroke="#64748B" stroke-width="1.8"/></marker></defs>
<rect x="0" y="0" width="1600" height="1000" fill="#FEFFFE"/>
<text x="75" y="66" text-anchor="start" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="27" font-weight="500" fill="#667085">02</text>
<text x="156" y="65" text-anchor="start" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="44" font-weight="500" fill="#263342">一次“制定计划”请求如何运转</text>
<text x="158" y="113" text-anchor="start" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="21" font-weight="400" fill="#667085">单领域请求规则直达 Planner；复杂请求另由 Router 选择多个领域 Agent</text>
<line x1="54" y1="147" x2="1546" y2="147" stroke="#CBD5E1" stroke-width="1.5"/>
<rect x="45" y="178" width="210" height="70" rx="12" fill="#DFF2E9" stroke="#64748B" stroke-width="2"/>
<text x="150.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="500" fill="#263342">用户</text>
<text x="150.0" y="233.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#667085">选择目标</text>
<rect x="305" y="178" width="210" height="70" rx="12" fill="#DFF2E9" stroke="#64748B" stroke-width="2"/>
<text x="410.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="500" fill="#263342">小程序 / Android</text>
<text x="410.0" y="233.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#667085">文字与语音界面</text>
<rect x="565" y="178" width="210" height="70" rx="12" fill="#DCEAF7" stroke="#64748B" stroke-width="2"/>
<text x="670.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="500" fill="#263342">FastAPI</text>
<text x="670.0" y="233.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#667085">接口与身份</text>
<rect x="825" y="178" width="210" height="70" rx="12" fill="#EAE5F6" stroke="#64748B" stroke-width="2"/>
<text x="930.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="500" fill="#263342">Harness Kernel</text>
<text x="930.0" y="233.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#667085">协作编排</text>
<rect x="1085" y="178" width="210" height="70" rx="12" fill="#F8E6D4" stroke="#64748B" stroke-width="2"/>
<text x="1190.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="500" fill="#263342">领域工具</text>
<text x="1190.0" y="233.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#667085">业务服务 / 存储</text>
<rect x="1345" y="178" width="210" height="70" rx="12" fill="#EEF1F3" stroke="#64748B" stroke-width="2"/>
<text x="1450.0" y="200.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="22" font-weight="500" fill="#263342">模型网关</text>
<text x="1450.0" y="233.0" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="16" font-weight="400" fill="#667085">文本模型适配</text>
<line x1="145" y1="249" x2="145" y2="949" stroke="#B9C2CA" stroke-width="1.5" stroke-dasharray="6 7"/>
<line x1="405" y1="249" x2="405" y2="949" stroke="#B9C2CA" stroke-width="1.5" stroke-dasharray="6 7"/>
<line x1="665" y1="249" x2="665" y2="949" stroke="#B9C2CA" stroke-width="1.5" stroke-dasharray="6 7"/>
<line x1="925" y1="249" x2="925" y2="949" stroke="#B9C2CA" stroke-width="1.5" stroke-dasharray="6 7"/>
<line x1="1185" y1="249" x2="1185" y2="949" stroke="#B9C2CA" stroke-width="1.5" stroke-dasharray="6 7"/>
<line x1="1445" y1="249" x2="1445" y2="949" stroke="#B9C2CA" stroke-width="1.5" stroke-dasharray="6 7"/>
<line x1="158" y1="293" x2="392" y2="293" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="275.0" y="271" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#263342">01 说出 / 输入计划目标</text>
<line x1="418" y1="353" x2="652" y2="353" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="535.0" y="331" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#263342">02 语音先转写，再提交请求</text>
<line x1="678" y1="413" x2="912" y2="413" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="795.0" y="391" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#263342">03 身份、安全与能力授权</text>
<line x1="938" y1="473" x2="1432" y2="473" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="1185.0" y="451" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#263342">04 规则直达 Planner，首轮推理</text>
<line x1="938" y1="533" x2="1172" y2="533" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="1055.0" y="511" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#263342">05 ReAct：Planner 读取约束</text>
<line x1="1172" y1="593" x2="938" y2="593" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="1055.0" y="571" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#263342">06 Observation：事实与缺口</text>
<line x1="938" y1="653" x2="1432" y2="653" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="1185.0" y="631" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#263342">07 Worker 收束 → Decision</text>
<line x1="912" y1="713" x2="678" y2="713" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="795.0" y="691" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#263342">08 安全复核，生成计划草案</text>
<line x1="652" y1="773" x2="418" y2="773" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="535.0" y="751" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#263342">09 计划页 + 悬浮会话审阅</text>
<line x1="158" y1="833" x2="392" y2="833" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="275.0" y="811" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#263342">10 用户确认草案</text>
<line x1="418" y1="893" x2="652" y2="893" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="535.0" y="871" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#263342">11 确认请求</text>
<line x1="678" y1="946" x2="1172" y2="946" stroke="#64748B" stroke-width="2.6" marker-end="url(#arrow)"/>
<text x="925.0" y="924" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="19" font-weight="500" fill="#263342">12 Action 校验 / 幂等 / 入库</text>
<text x="800" y="983" text-anchor="middle" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="17" font-weight="400" fill="#667085">关键边界：草案不直接写库；确认后才执行 Action</text>
</svg>