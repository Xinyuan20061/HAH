<text x="158" y="113" text-anchor="start" dominant-baseline="middle" font-family="Microsoft YaHei, Noto Sans CJK SC, Arial, sans-serif" font-size="21" font-weight="400" fill="#667085">人格决定表达 · 领域 Agent 决定任务 · Harness 决定权限与执行</text>
