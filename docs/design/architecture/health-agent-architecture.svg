<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">HealthMate 多 Agent ReAct Harness 架构</title>
<desc id="desc">小健、小康、小管家共享安全与上下文层；Router 路由至领域 Agent，领域 Agent 在受限工具中进行 ReAct，Decision 输出唯一答复，写操作等待用户确认。</desc>
