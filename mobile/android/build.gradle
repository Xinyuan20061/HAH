// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    configurations.configureEach {
        resolutionStrategy.eachDependency { dependency ->
            if (dependency.requested.group == 'org.jetbrains.kotlin' &&
                dependency.requested.name in ['kotlin-stdlib-jdk7', 'kotlin-stdlib-jdk8'] &&
                dependency.requested.version == '1.6.21') {
                dependency.useVersion('1.8.22')
                dependency.because('Kotlin 1.8 merged the JDK 7/8 APIs into kotlin-stdlib; keep the legacy artifacts metadata-only.')
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
